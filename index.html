<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>JARVIS | Premium AI</title>
    
    <!-- External Libraries -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

    <style>
        /* Typography & Global Reset */
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap');
        
        :root {
            --glass-bg: rgba(30, 30, 35, 0.45);
            --glass-border: rgba(255, 255, 255, 0.12);
        }

        * { box-sizing: border-box; }

        body, html {
            margin: 0; padding: 0;
            width: 100%; height: 100%;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            overflow: hidden;
            background-color: #000;
            color: white;
            -webkit-font-smoothing: antialiased;
        }

        /* Immersive Background */
        #bg-image {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background-image: url('https://files.catbox.moe/l2qj63.jpg');
            background-size: cover; background-position: center;
            z-index: -2; transform: scale(1.05);
        }
        
        #bg-overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(to bottom, rgba(0,0,0,0.3) 0%, rgba(0,0,0,0.85) 100%);
            z-index: -1;
        }

        /* Glassmorphism Classes */
        .glass-panel {
            background: var(--glass-bg);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border: 1px solid var(--glass-border);
            border-radius: 24px;
            box-shadow: 0 24px 40px -12px rgba(0, 0, 0, 0.5), inset 0 1px 0 rgba(255,255,255,0.1);
        }

        .glass-input {
            background: rgba(0, 0, 0, 0.3); border: 1px solid var(--glass-border);
            color: white; transition: all 0.3s ease;
        }
        
        .glass-input:focus {
            outline: none; border-color: rgba(255, 255, 255, 0.4);
            background: rgba(0, 0, 0, 0.5); box-shadow: 0 0 15px rgba(255,255,255,0.05);
        }

        .glass-btn {
            background: rgba(255, 255, 255, 0.1); border: 1px solid var(--glass-border);
            backdrop-filter: blur(10px); cursor: pointer; transition: all 0.3s ease;
        }
        
        .glass-btn:hover { background: rgba(255, 255, 255, 0.2); transform: translateY(-1px); }
        .glass-btn:active { transform: translateY(1px); }

        /* Screens */
        #setup-screen, #main-interface {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
        }
        #main-interface { display: none; z-index: 10; }
        #setup-screen { z-index: 50; padding: 20px; }

        /* 3D Orb */
        #orb-container {
            width: 100%; height: 50vh; display: flex; align-items: center; justify-content: center;
        }
        #orb-canvas { width: 300px; height: 300px; pointer-events: none; }

        /* Conversation Glass Panel */
        #conversation-panel {
            width: 90%; max-width: 600px; height: 30vh; margin-bottom: 8vh;
            display: flex; flex-direction: column; overflow-y: auto; padding: 20px;
            scrollbar-width: none;
            mask-image: linear-gradient(to bottom, transparent 0%, black 15%, black 85%, transparent 100%);
            -webkit-mask-image: linear-gradient(to bottom, transparent 0%, black 15%, black 85%, transparent 100%);
        }
        #conversation-panel::-webkit-scrollbar { display: none; }

        .message { margin-bottom: 16px; opacity: 0; transform: translateY(10px); animation: slideUpFade 0.5s ease forwards; }
        .msg-you { color: rgba(255, 255, 255, 0.6); font-size: 0.95rem; font-weight: 400; }
        .msg-jarvis { color: rgba(255, 255, 255, 1); font-size: 1.15rem; font-weight: 300; letter-spacing: 0.3px; margin-top: 4px; }

        @keyframes slideUpFade { to { opacity: 1; transform: translateY(0); } }

        /* UI Utilities */
        .loader {
            border: 2px solid rgba(255,255,255,0.1); border-top: 2px solid white;
            border-radius: 50%; width: 18px; height: 18px; animation: spin 1s linear infinite; display: none;
        }
        @keyframes spin { 100% { transform: rotate(360deg); } }

        #status-indicator {
            position: absolute; top: 40px; font-size: 0.75rem; letter-spacing: 3px;
            text-transform: uppercase; color: rgba(255,255,255,0.4); font-weight: 500;
        }

        #notification {
            position: absolute; top: -80px; left: 50%; transform: translateX(-50%);
            padding: 12px 24px; border-radius: 20px; background: rgba(255, 60, 60, 0.3);
            border: 1px solid rgba(255, 60, 60, 0.4); backdrop-filter: blur(12px);
            color: white; font-size: 0.9rem; transition: all 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            z-index: 100; text-align: center;
        }
        #notification.show { top: 40px; }

        @media (max-width: 768px) {
            #orb-container { height: 45vh; }
            #orb-canvas { width: 250px; height: 250px; }
            #conversation-panel { height: 40vh; margin-bottom: 2vh; width: 95%; }
            .msg-jarvis { font-size: 1.05rem; }
        }
    </style>
</head>
<body>

    <div id="bg-image"></div>
    <div id="bg-overlay"></div>
    <div id="notification"></div>

    <!-- INITIALIZATION SCREEN -->
    <div id="setup-screen">
        
        <!-- Step 1: OpenRouter API -->
        <div id="step-openrouter" class="glass-panel w-full max-w-md p-8 flex flex-col items-center text-center">
            <h1 class="text-3xl font-light tracking-wide mb-2">JARVIS</h1>
            <p class="text-white/50 text-sm mb-8">System Initialization</p>
            
            <div class="w-full text-left mb-2">
                <label class="text-xs text-white/60 ml-2 uppercase tracking-wider">OpenRouter API Key</label>
            </div>
            <input type="password" id="or-key" class="glass-input w-full px-4 py-3 rounded-xl mb-6 text-sm" placeholder="sk-or-v1-...">
            
            <button onclick="testOpenRouter()" class="glass-btn w-full py-3 rounded-xl flex items-center justify-center gap-2">
                <span id="btn-text-or">Connect AI Core</span>
                <div id="loader-or" class="loader"></div>
            </button>
            <p class="text-[10px] text-white/30 mt-5 leading-relaxed">
                Security Notice: Keys are stored only in volatile browser memory.
            </p>
        </div>

        <!-- Step 2: ElevenLabs API -->
        <div id="step-eleven" class="glass-panel w-full max-w-md p-8 flex flex-col items-center text-center hidden">
            <h2 class="text-2xl font-light mb-2">Voice Synthesis</h2>
            <p class="text-white/50 text-sm mb-8">Connect Audio Output</p>
            
            <div class="w-full text-left mb-2">
                <label class="text-xs text-white/60 ml-2 uppercase tracking-wider">ElevenLabs API Key</label>
            </div>
            <input type="password" id="el-key" class="glass-input w-full px-4 py-3 rounded-xl mb-4 text-sm" placeholder="sk_...">
            
            <div class="w-full text-left mb-2">
                <label class="text-xs text-white/60 ml-2 uppercase tracking-wider">Voice ID</label>
            </div>
            <input type="text" id="el-voice" class="glass-input w-full px-4 py-3 rounded-xl mb-6 text-sm" placeholder="21m00Tcm4TlvDq8ikWAM" value="21m00Tcm4TlvDq8ikWAM">
            
            <button onclick="testElevenLabs()" class="glass-btn w-full py-3 rounded-xl flex items-center justify-center gap-2">
                <span id="btn-text-el">Initialize JARVIS</span>
                <div id="loader-el" class="loader"></div>
            </button>
        </div>
    </div>

    <!-- MAIN ACTIVE INTERFACE -->
    <div id="main-interface">
        <div id="status-indicator">Idle</div>
        <div id="orb-container"><div id="orb-canvas"></div></div>
        <div id="conversation-panel" class="glass-panel">
            <div class="message">
                <div class="msg-jarvis text-center text-white/40 text-sm italic mt-4">System online. Waiting for voice...</div>
            </div>
        </div>
    </div>

    <script>
        // --- State Management ---
        const config = { openrouter: '', elevenlabs: '', voiceId: '21m00Tcm4TlvDq8ikWAM' };
        let orbState = 'idle'; // idle, listening, thinking, speaking
        let isSpeaking = false;
        
        let conversationHistory = [
            { 
                role: "system", 
                content: "You are JARVIS, an advanced, highly efficient AI assistant. Keep responses brief and concise. You understand and can reply natively in English, Urdu, Roman Urdu, or Punjabi depending on how the user speaks to you." 
            }
        ];

        // Audio variables for analysis
        let audioContext, analyser, dataArray;

        // --- UI Helpers ---
        const showNotification = (msg) => {
            const el = document.getElementById('notification');
            el.innerText = msg; el.classList.add('show');
            setTimeout(() => el.classList.remove('show'), 4000);
        };

        const setLoading = (step, isLoading) => {
            document.getElementById(`btn-text-${step}`).style.display = isLoading ? 'none' : 'block';
            document.getElementById(`loader-${step}`).style.display = isLoading ? 'block' : 'none';
        };

        const updateStatus = (stateStr) => {
            orbState = stateStr.toLowerCase();
            document.getElementById('status-indicator').innerText = stateStr.toUpperCase();
        };

        const appendMessage = (sender, text) => {
            const panel = document.getElementById('conversation-panel');
            const msgDiv = document.createElement('div');
            msgDiv.className = 'message';
            
            if(sender === 'You') {
                msgDiv.innerHTML = `<div class="msg-you">You: "${text}"</div>`;
            } else {
                msgDiv.innerHTML = `<div class="msg-jarvis">JARVIS: "${text}"</div>`;
            }
            
            panel.appendChild(msgDiv);
            panel.scrollTo({ top: panel.scrollHeight, behavior: 'smooth' });
        };

        // --- Step 1: OpenRouter Auth ---
        async function testOpenRouter() {
            const key = document.getElementById('or-key').value.trim();
            if(!key.startsWith("sk-")) return showNotification("Invalid OpenRouter Key format (must start with sk-)");
            
            setLoading('or', true);
            
            try {
                const referer = window.location.protocol === 'file:' ? 'https://localhost' : window.location.href;
                
                // Test connection
                const res = await fetch('https://openrouter.ai/api/v1/chat/completions', {
                    method: 'POST',
                    headers: {
                        'Authorization': `Bearer ${key}`,
                        'HTTP-Referer': referer,
                        'X-Title': 'JARVIS Interface',
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        model: "openai/gpt-4o-mini", // Very fast, excellent multilingual capabilities
                        messages: [{ role: "user", content: "Say ok" }],
                        max_tokens: 5
                    })
                });

                if(!res.ok) throw new Error("Invalid OpenRouter Key.");
                
                config.openrouter = key;
                
                // Animate to next step
                gsap.to("#step-openrouter", { opacity: 0, y: -20, duration: 0.4, onComplete: () => {
                    document.getElementById('step-openrouter').classList.add('hidden');
                    document.getElementById('step-eleven').classList.remove('hidden');
                    gsap.fromTo("#step-eleven", { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.4 });
                }});

            } catch (err) {
                showNotification("OpenRouter connection failed. Check key.");
            } finally {
                setLoading('or', false);
            }
        }

        // --- Step 2: ElevenLabs Auth ---
        async function testElevenLabs() {
            const key = document.getElementById('el-key').value.trim();
            const vId = document.getElementById('el-voice').value.trim();
            if(!key) return showNotification("Please enter an ElevenLabs API Key");
            
            setLoading('el', true);
            
            try {
                const res = await fetch('https://api.elevenlabs.io/v1/voices', {
                    headers: { 'xi-api-key': key }
                });

                if(!res.ok) throw new Error("Invalid ElevenLabs Key.");
                
                config.elevenlabs = key;
                if(vId) config.voiceId = vId;
                
                startSystem();

            } catch (err) {
                showNotification("ElevenLabs connection failed. Check key.");
            } finally {
                setLoading('el', false);
            }
        }

        // --- Core System Initialization ---
        function startSystem() {
            // Audio context requires user gesture initialization
            const AudioContext = window.AudioContext || window.webkitAudioContext;
            audioContext = new AudioContext();
            analyser = audioContext.createAnalyser();
            analyser.fftSize = 256;
            dataArray = new Uint8Array(analyser.frequencyBinCount);

            gsap.to("#setup-screen", { 
                opacity: 0, duration: 1, 
                onComplete: () => {
                    document.getElementById('setup-screen').style.display = 'none';
                    document.getElementById('main-interface').style.display = 'flex';
                    
                    initOrb();
                    
                    // Background breath animation
                    gsap.to("#bg-image", { scale: 1.0, duration: 12, repeat: -1, yoyo: true, ease: "sine.inOut" });
                    
                    // Startup effect
                    confetti({ particleCount: 50, spread: 60, origin: { y: 0.8 }, colors: ['#ffffff', '#aaddff'] });

                    // Warn if running locally (Chrome blocks mic on file://)
                    if(window.location.protocol === 'file:') {
                        showNotification("Warning: Mic may be blocked. Run via local server (http://).");
                    }

                    setTimeout(startListening, 1500);
                }
            });
        }

        // --- 3D Liquid Glass Orb ---
        const initOrb = () => {
            const container = document.getElementById('orb-canvas');
            const scene = new THREE.Scene();
            
            const camera = new THREE.PerspectiveCamera(45, 1, 0.1, 1000);
            camera.position.z = 4;

            const renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true });
            renderer.setSize(300, 300);
            renderer.setPixelRatio(window.devicePixelRatio);
            container.appendChild(renderer.domElement);

            // Lighting for glass reflection
            scene.add(new THREE.AmbientLight(0xffffff, 0.4));
            const dirLight = new THREE.DirectionalLight(0xffffff, 2);
            dirLight.position.set(2, 2, 2);
            scene.add(dirLight);
            const backLight = new THREE.DirectionalLight(0x88ccff, 3);
            backLight.position.set(-2, -2, -2);
            scene.add(backLight);

            // Geometry & Material
            const geometry = new THREE.SphereGeometry(1.2, 64, 64);
            const material = new THREE.MeshPhysicalMaterial({
                color: 0x111111, metalness: 0.2, roughness: 0.1,
                transmission: 0.95, thickness: 0.8, ior: 1.5,
                emissive: 0x112233, emissiveIntensity: 0.3,
                clearcoat: 1.0, clearcoatRoughness: 0.1
            });

            const sphere = new THREE.Mesh(geometry, material);
            scene.add(sphere);

            // Save vertices for animation
            const posAttr = geometry.attributes.position;
            const vData = [];
            for (let i = 0; i < posAttr.count; i++) {
                vData.push({ x: posAttr.getX(i), y: posAttr.getY(i), z: posAttr.getZ(i) });
            }

            let time = 0;
            
            // Animation Loop
            const animate = () => {
                requestAnimationFrame(animate);
                time += 0.03;
                
                let targetEmissive = 0x112233;
                let intensity = 0.3;
                let speed = 1;
                let baseDeformation = 0.04;

                // State logic
                if (orbState === 'listening') {
                    targetEmissive = 0x2266aa; intensity = 0.9; speed = 2.5; baseDeformation = 0.08;
                } else if (orbState === 'thinking') {
                    targetEmissive = 0x6633aa; intensity = 1.0; speed = 4.0; baseDeformation = 0.12;
                } else if (orbState === 'speaking') {
                    targetEmissive = 0x3388aa; intensity = 0.8;
                    let audioMod = 0;
                    if (isSpeaking && analyser) {
                        analyser.getByteFrequencyData(dataArray);
                        let sum = 0;
                        for(let i=0; i<dataArray.length; i++) sum += dataArray[i];
                        audioMod = (sum / dataArray.length) / 255; 
                    }
                    baseDeformation = 0.08 + (audioMod * 0.4);
                    speed = 2 + (audioMod * 2.5);
                    sphere.scale.setScalar(1 + (audioMod * 0.15));
                } else {
                    sphere.scale.setScalar(1);
                }

                material.emissive.lerp(new THREE.Color(targetEmissive), 0.05);
                material.emissiveIntensity += (intensity - material.emissiveIntensity) * 0.1;

                // Vertex manipulation (Liquid effect)
                for (let i = 0; i < posAttr.count; i++) {
                    const v = vData[i];
                    const offset = Math.sin(v.x * 3 + time * speed) * Math.cos(v.y * 3 + time * speed * 0.8) * Math.sin(v.z * 3 + time * speed * 1.2);
                    const norm = new THREE.Vector3(v.x, v.y, v.z).normalize();
                    const disp = baseDeformation * offset;
                    posAttr.setXYZ(i, v.x + norm.x * disp, v.y + norm.y * disp, v.z + norm.z * disp);
                }
                
                geometry.computeVertexNormals();
                posAttr.needsUpdate = true;
                sphere.rotation.y += 0.004; sphere.rotation.z += 0.002;
                renderer.render(scene, camera);
            };
            
            animate();
        };

        // --- Voice Input (Web Speech API) ---
        function startListening() {
            if (!('webkitSpeechRecognition' in window)) {
                return showNotification("Browser does not support Speech Recognition.");
            }

            const recognition = new webkitSpeechRecognition();
            recognition.continuous = false;
            recognition.interimResults = false;
            recognition.lang = 'en-US'; // Best baseline for phonetic catching

            recognition.onstart = () => updateStatus('Listening');

            recognition.onresult = (event) => {
                const transcript = event.results[0][0].transcript;
                appendMessage('You', transcript);
                processLogic(transcript);
            };

            recognition.onerror = (e) => {
                if (e.error === 'no-speech') {
                    setTimeout(startListening, 1000);
                } else {
                    updateStatus('Idle');
                    showNotification("Mic error: " + e.error);
                }
            };

            recognition.onend = () => {
                if(orbState === 'listening') updateStatus('Idle');
            };

            try { recognition.start(); } catch (e) { }
        }

        // --- AI Logic (OpenRouter) ---
        async function processLogic(userText) {
            updateStatus('Thinking');
            conversationHistory.push({ role: "user", content: userText });

            try {
                const referer = window.location.protocol === 'file:' ? 'https://localhost' : window.location.href;
                
                const res = await fetch('https://openrouter.ai/api/v1/chat/completions', {
                    method: 'POST',
                    headers: {
                        'Authorization': `Bearer ${config.openrouter}`,
                        'HTTP-Referer': referer,
                        'X-Title': 'JARVIS UI',
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        model: "openai/gpt-4o-mini", // Default fast model
                        messages: conversationHistory
                    })
                });

                if(!res.ok) throw new Error("Brain API failed");
                
                const data = await res.json();
                let reply = data.choices[0].message.content;
                
                // Clean markdown for text-to-speech engine
                reply = reply.replace(/[*#_]/g, '').trim();

                conversationHistory.push({ role: "assistant", content: reply });
                
                appendMessage('JARVIS', reply);
                speakOut(reply);

            } catch (err) {
                console.error(err);
                showNotification("AI processing failed. Retrying...");
                updateStatus('Idle');
                setTimeout(startListening, 2000);
            }
        }

        // --- Voice Output (ElevenLabs) ---
        async function speakOut(text) {
            updateStatus('Speaking');
            
            try {
                const res = await fetch(`https://api.elevenlabs.io/v1/text-to-speech/${config.voiceId}?output_format=mp3_44100_128`, {
                    method: 'POST',
                    headers: {
                        'xi-api-key': config.elevenlabs,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        text: text,
                        model_id: "eleven_multilingual_v2" // Handles Urdu/Punjabi well
                    })
                });

                if(!res.ok) throw new Error("TTS failed");

                const arrayBuffer = await res.arrayBuffer();
                
                audioContext.decodeAudioData(arrayBuffer, (buffer) => {
                    const source = audioContext.createBufferSource();
                    source.buffer = buffer;
                    
                    // Connect for visualizer and playback
                    source.connect(analyser);
                    analyser.connect(audioContext.destination);
                    
                    isSpeaking = true;
                    source.start(0);

                    source.onended = () => {
                        isSpeaking = false;
                        updateStatus('Idle');
                        
                        // Restart continuous listening automatically
                        setTimeout(startListening, 800);
                    };
                });

            } catch (err) {
                console.error(err);
                showNotification("Voice synthesis failed.");
                updateStatus('Idle');
                setTimeout(startListening, 2000);
            }
        }
    </script>
</body>
</html>
